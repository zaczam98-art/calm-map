name: collect-seoul-citydata

# 수집 작업 하나가 최대 5시간 45분 동안 매시 6분에 한 바퀴(scripts/cycle.sh)를 돌고, 끝나기 전에 다음 작업을 스스로 실행한다.
# GitHub의 예약 실행(cron)은 지연과 누락이 잦아서 사슬이 끊겼을 때의 예비로만 둔다.
# 동시 실행 그룹이 겹침을 막고, 공개 저장소라 Actions 사용 시간에 제한이 없다(작업 하나의 상한은 6시간).

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      force_briefing:
        description: '브리핑을 시간 조건과 무관하게 다시 만든다(첫 바퀴에만)'
        type: boolean
        default: false
      sdot_days:
        description: '소음 센서(S-DoT) 자료를 한 바퀴에 며칠 치까지 받을지'
        type: string
        default: '6'

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: hourly loop (up to 5h45m)
        id: loop
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_BRIEFING: ${{ inputs.force_briefing && '1' || '' }}
          SDOT_MAX_DAYS: ${{ inputs.sdot_days || '6' }}
        run: |
          start=$(date +%s)
          limit=$((5 * 3600 + 45 * 60))
          while :; do
            echo "=== cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            bash scripts/cycle.sh || echo "cycle failed $(date -u +%H:%MZ)"
            unset FORCE FORCE_BRIEFING
            now=$(date +%s)
            next=$(( (now / 3600 + 1) * 3600 + 6 * 60 ))   # 다음 정시 + 6분(서울시 자료가 정시 직후 갱신된다)
            if [ $((next - start)) -ge "$limit" ]; then
              echo "time budget reached; handing over"
              echo "handover=true" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep $((next - now))
          done
      - name: chain the next run
        # 시간 예산을 다 쓴 경우에만 잇는다. 일찍 끝난(실패한) 작업이 곧바로 다음 작업을 띄워 빠르게 반복하는 일을 막는다.
        if: steps.loop.outputs.handover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-seoul-citydata --repo "$GITHUB_REPOSITORY" || echo "could not dispatch the next run; the schedule will pick it up"
