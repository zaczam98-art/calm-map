name: collect-seoul-citydata

on:
  schedule:
    # GitHub 예약 실행은 지연과 누락이 잦다. 15분마다 시도하고, 스크립트가 직전 수집 후 50분 이내면 건너뛴다.
    # 그래서 장소당 호출은 시간당 1회 이하(121곳이면 하루 2,904회 이하)로 유지된다.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_briefing:
        description: '브리핑을 시간 조건과 무관하게 다시 만든다'
        type: boolean
        default: false
      sdot_days:
        description: '소음 센서(S-DoT) 자료를 한 번에 며칠 치까지 받을지'
        type: string
        default: '6'

permissions:
  contents: write

concurrency:
  group: collect-data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: restore files from data branch
        run: |
          git fetch origin data:data || true
          if git show-ref --quiet refs/heads/data; then
            for f in snapshot.json history.json pattern.json metrics.json briefing.json noise_state.json noise.json; do
              git show "data:$f" > "$f" 2>/dev/null || rm -f "$f"
            done
          fi
      - name: collect
        id: collect
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/collect_seoul.py snapshot.json history.json
      - name: derive weekly pattern and forecast accuracy
        if: steps.collect.outputs.changed == 'true'
        continue-on-error: true
        run: python3 scripts/derive_stats.py history.json pattern.json metrics.json
      - name: daily briefing (generative AI + rule check)
        if: steps.collect.outputs.changed == 'true'
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FORCE_BRIEFING: ${{ inputs.force_briefing && '1' || '' }}
        run: python3 scripts/gen_briefing.py snapshot.json briefing.json
      - name: noise and light from S-DoT sensors (daily data, incremental)
        if: steps.collect.outputs.changed == 'true'
        continue-on-error: true
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          SDOT_MAX_DAYS: ${{ inputs.sdot_days || '6' }}
        run: python3 scripts/collect_sdot.py noise_state.json noise.json
      - name: publish to data branch (single commit)
        if: steps.collect.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/data
          for f in snapshot.json history.json pattern.json metrics.json briefing.json noise_state.json noise.json; do
            if [ -s "$f" ]; then cp "$f" /tmp/data/; fi
          done
          test -s /tmp/data/snapshot.json && test -s /tmp/data/history.json
          git config user.name "calm-map-bot"
          git config user.email "bot@users.noreply.github.com"
          # data 브랜치는 항상 커밋 1개만 둔다(누적 파일이 커밋마다 쌓여 저장소가 커지는 것을 막는다)
          git checkout --orphan data-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/data/*.json .
          for f in snapshot.json history.json pattern.json metrics.json briefing.json noise_state.json noise.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin data-publish:data
